services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pass123
      MYSQL_DATABASE: jokesdb
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppass123"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  joke-service:
    build: ./joke-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: pass123
      DB_NAME: jokesdb
      PORT: 3000
    depends_on:
      mysql:
        condition: service_healthy

  submit-service:
    build: ./submit-service
    environment:
      PORT: 3001
      RABBITMQ_URL: amqp://rabbitmq:5672
      QUEUE_NAME: SUBMITTED_JOKES
      JOKE_SERVICE_TYPES_URL: http://joke-service:3000/types
      TYPES_CACHE_PATH: /usr/src/data/types.json
    volumes:
      - submit-types:/usr/src/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      joke-service:
        condition: service_started

  etl-service:
    build: ./etl-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: pass123
      DB_NAME: jokesdb
      RABBITMQ_URL: amqp://rabbitmq:5672
      QUEUE_NAME: SUBMITTED_JOKES
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: "off"
      KONG_SSL_CERT: /etc/kong/certs/localhost.crt
      KONG_SSL_CERT_KEY: /etc/kong/certs/localhost.key
    ports:
      - "8443:8443"
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
      - ./kong/certs:/etc/kong/certs:ro
    depends_on:
      joke-service:
        condition: service_started
      submit-service:
        condition: service_started

volumes:
  mysql-data:
  rabbitmq-data:
  submit-types:
